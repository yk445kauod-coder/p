<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TraceBook">
  <!--
    TraceBook mark — an open book seen head-on, with a bookmark ribbon.

    Drawn on a 64 grid so the silhouette stays legible from 16px (favicon) up to
    a 512px maskable icon. Only four shapes, high contrast, no fine detail: a
    book has to read as a book at one glance and one pixel of stroke.
  -->
  <defs>
    <!-- A single warm wash so the mark has depth without needing another hue. -->
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7EA"/>
      <stop offset="1" stop-color="#F3E2C7"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C2570A"/>
      <stop offset="1" stop-color="#E2700F"/>
    </linearGradient>
  </defs>

  <!-- Rounded square plate. Kept in the mark so the icon reads on any surface. -->
  <rect width="64" height="64" rx="15" fill="#16120E"/>

  <!-- Back cover, very slightly larger than the pages, for a crisp edge. -->
  <path d="M8 15.5c0-1.9 1.6-3.4 3.5-3.2l17 1.6c1.4.1 2.5 1.3 2.5 2.7v33c0 1.9-1.6 3.4-3.5 3.2l-17-1.6A2.7 2.7 0 0 1 8 48.5z"
        fill="url(#spine)"/>
  <path d="M56 15.5c0-1.9-1.6-3.4-3.5-3.2l-17 1.6A2.7 2.7 0 0 0 33 16.6v33c0 1.9 1.6 3.4 3.5 3.2l17-1.6a2.7 2.7 0 0 0 2.5-2.7z"
        fill="url(#spine)"/>

  <!-- Facing pages. -->
  <path d="M11.5 15.9c0-1.2 1-2.1 2.2-2l13.6 1.3c.9.1 1.6.8 1.6 1.7v29.6c0 1.2-1 2.1-2.2 2l-13.6-1.3a1.7 1.7 0 0 1-1.6-1.7z"
        fill="url(#page)"/>
  <path d="M52.5 15.9c0-1.2-1-2.1-2.2-2L36.7 15.2a1.7 1.7 0 0 0-1.6 1.7v29.6c0 1.2 1 2.1 2.2 2l13.6-1.3c.9-.1 1.6-.8 1.6-1.7z"
        fill="url(#page)"/>

  <!-- Text rules. Three on each page: enough to say "writing", gone by 16px. -->
  <g fill="#B9A489" opacity="0.85">
    <rect x="15" y="22" width="11" height="1.9" rx="0.95"/>
    <rect x="15" y="27.5" width="11" height="1.9" rx="0.95"/>
    <rect x="15" y="33" width="7.5" height="1.9" rx="0.95"/>
    <rect x="38" y="22" width="11" height="1.9" rx="0.95"/>
    <rect x="38" y="27.5" width="11" height="1.9" rx="0.95"/>
    <rect x="41.5" y="33" width="7.5" height="1.9" rx="0.95"/>
  </g>

  <!-- Spine gap, so the two pages never merge into one slab. -->
  <rect x="31" y="14" width="2" height="36" rx="1" fill="#16120E" opacity="0.55"/>

  <!-- Bookmark ribbon, the one asymmetric detail that makes it a TraceBook. -->
  <path d="M38.5 9.5h7.5a1.6 1.6 0 0 1 1.6 1.6V30l-5.35-3.4L37 30V11.1a1.6 1.6 0 0 1 1.5-1.6z"
        fill="#FF9500"/>
</svg>
